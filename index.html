<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14100c" />
    <title>Pixelarrow</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #14100c; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      /* Safe area: device insets (max of env() and Telegram's safeAreaInset, set by src/platform/safeArea.ts,
         falling back to Telegram's own CSS vars) plus Telegram's content insets (full-screen Close/Back and menu pills). */
      :root {
        --pa-t: calc(max(env(safe-area-inset-top, 0px), var(--pa-safe-top, var(--tg-safe-area-inset-top, 0px))) + var(--pa-content-top, var(--tg-content-safe-area-inset-top, 0px)));
        --pa-b: calc(max(env(safe-area-inset-bottom, 0px), var(--pa-safe-bottom, var(--tg-safe-area-inset-bottom, 0px))) + var(--pa-content-bottom, var(--tg-content-safe-area-inset-bottom, 0px)));
        --pa-l: calc(max(env(safe-area-inset-left, 0px), var(--pa-safe-left, var(--tg-safe-area-inset-left, 0px))) + var(--pa-content-left, var(--tg-content-safe-area-inset-left, 0px)));
        --pa-r: calc(max(env(safe-area-inset-right, 0px), var(--pa-safe-right, var(--tg-safe-area-inset-right, 0px))) + var(--pa-content-right, var(--tg-content-safe-area-inset-right, 0px)));
      }
      #game { position: fixed; top: var(--pa-t); bottom: var(--pa-b); left: calc(50% + (var(--pa-l) - var(--pa-r)) / 2); transform: translateX(-50%); width: min(calc(100vw - var(--pa-l) - var(--pa-r)), calc((100vh - var(--pa-t) - var(--pa-b)) * 0.64)); }
      #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; width: 100% !important; height: 100% !important; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
