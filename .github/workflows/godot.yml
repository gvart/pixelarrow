name: Godot

# The Godot port (docs/impl/godot-port.md): golden traces, the data and view exports from the TS source, the C++ sim
# extension, then the headless Godot tests against them.

on:
  push:
    branches: [main, 'feat/godot-*']
    paths: ['godot/**', 'src/war/**', 'src/data/**', 'src/sim/**', 'src/art/**', 'src/assets/sheets/**', 'public/war/**', 'src/dev/godot*.ts', 'src/dev/vectors/**', 'server/src/war/**', 'scripts/godot/**', '.github/workflows/godot.yml']
  pull_request:
    paths: ['godot/**', 'src/war/**', 'src/data/**', 'src/sim/**', 'src/art/**', 'src/assets/sheets/**', 'public/war/**', 'src/dev/godot*.ts', 'src/dev/vectors/**', 'server/src/war/**', 'scripts/godot/**', '.github/workflows/godot.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 25 (V8 14.1), as on the dev machine: the traces' math depends on V8's version (Node 22 still uses fdlibm pow,
      # 25 std::pow; docs/impl/godot-port.md "Cross-platform math").
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      # the room vectors (src/dev/vectors/room.ts) run the server's WarRoom, which imports the server's packages
      - run: npm ci --prefix server
      - run: npm run traces:godot
      - run: npm run data:godot
      # the region view's data (npm run view:godot): the ground and object art code needs canvases, so it bakes in
      # headless Chromium; with it the Elaia sample tests (godot/tests/region) run instead of skipping
      - id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Chromium system libraries
        continue-on-error: true
        run: |
          printf '%s\n' 'DPkg::Lock::Timeout "120";' 'Acquire::Retries "3";' \
            | sudo tee /etc/apt/apt.conf.d/99ci-browser-setup > /dev/null
          bash .github/actions/browser-setup/bounded-retry.sh 480 300 npx playwright install-deps chromium
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bash .github/actions/browser-setup/bounded-retry.sh 240 120 npx playwright install --only-shell chromium
      - run: npm run view:godot
      - name: Cache the native build (godot-cpp takes minutes)
        uses: actions/cache@v4
        with:
          path: build/native
          key: native-${{ runner.os }}-${{ hashFiles('godot/native/CMakeLists.txt') }}-${{ hashFiles('godot/native/src/**') }}
          restore-keys: native-${{ runner.os }}-${{ hashFiles('godot/native/CMakeLists.txt') }}-
      - name: Build the sim extension
        run: |
          cmake -S godot/native -B build/native -DCMAKE_BUILD_TYPE=Release -DGODOTCPP_TARGET=template_debug
          cmake --build build/native -j 4
      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      # Godot 4.7.2 on Linux aborts when the editor quits with any godot-cpp extension loaded (a minimal one-class
      # extension too, reproduced in Docker). The import is done by then: tolerate the exit code, check the class cache
      # landed, and make sure the extension list is there.
      - name: Import the project
        run: |
          godot --headless --path godot --import || true
          test -f godot/.godot/global_script_class_cache.cfg
          echo "res://pixelsim.gdextension" > godot/.godot/extension_list.cfg
      - run: godot --headless --path godot -s res://tests/run.gd
