name: Godot

# The Godot port (docs/impl/godot-port.md): golden traces and the data export from the TS source, the C++ sim extension,
# then the headless Godot tests against them.

on:
  push:
    branches: [main, 'feat/godot-*']
    paths: ['godot/**', 'src/war/**', 'src/data/**', 'src/sim/**', 'src/dev/godotTraces.ts', 'scripts/godot/**', '.github/workflows/godot.yml']
  pull_request:
    paths: ['godot/**', 'src/war/**', 'src/data/**', 'src/sim/**', 'src/dev/godotTraces.ts', 'scripts/godot/**', '.github/workflows/godot.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run traces:godot
      - run: npm run data:godot
      - name: Cache the native build (godot-cpp takes minutes)
        uses: actions/cache@v4
        with:
          path: build/native
          key: native-${{ runner.os }}-${{ hashFiles('godot/native/CMakeLists.txt') }}-${{ hashFiles('godot/native/src/**') }}
          restore-keys: native-${{ runner.os }}-${{ hashFiles('godot/native/CMakeLists.txt') }}-
      - name: Build the sim extension
        run: |
          cmake -S godot/native -B build/native -DCMAKE_BUILD_TYPE=Release -DGODOTCPP_TARGET=template_debug
          cmake --build build/native -j 4
      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      # Godot 4.7.2 on Linux aborts when the editor quits with any godot-cpp extension loaded (a minimal one-class
      # extension too, reproduced in Docker). The import is done by then: tolerate the exit code, check the class cache
      # landed, and make sure the extension list is there.
      - name: Import the project
        run: |
          godot --headless --path godot --import || true
          test -f godot/.godot/global_script_class_cache.cfg
          echo "res://pixelsim.gdextension" > godot/.godot/extension_list.cfg
      - run: godot --headless --path godot -s res://tests/run.gd
