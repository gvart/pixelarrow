name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push supersedes a queued one but never
# cancels a deployment that is already running.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pixelarrow.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # vitest 5 needs Node >= 22.12 (vite 8 alone would run on 20.19+).
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # ---- client (static game in dist/)
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

      # ---- layout check (docs/UI_KIT.md "Layout check"): every screen at five
      # phone sizes, with and without Telegram's safe-area insets, in English
      # and Russian. Known violations are allowlisted with an owner in
      # scripts/layout-allowlist.json; anything else fails the deploy.
      - name: Install Chromium for the layout check
        run: npx playwright install --with-deps chromium
      - name: Layout check
        run: |
          npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          node scripts/layout-check.mjs http://localhost:4173/ --jobs 4
      - name: Upload layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-screenshots
          path: docs/screenshots/layout
          retention-days: 14

      # ---- server (Worker API in server/, bundles ../src/sim)
      - run: npm ci
        working-directory: server
      - run: npx tsc --noEmit
        working-directory: server
      - run: npx vitest run
        working-directory: server

      # wrangler.deploy.json = wrangler.jsonc with the D1 id filled in from the
      # D1_DATABASE_ID Actions variable (or secret), or without the D1 binding
      # when it is unset (the API then answers 503 "database not configured").
      - id: config
        run: node server/scripts/deploy-config.mjs wrangler.jsonc
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}

      - name: Apply D1 migrations
        if: steps.config.outputs.d1 == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Uses the wrangler pinned in server/package-lock.json.
          workingDirectory: server
          command: d1 migrations apply pixelarrow --remote --config ../wrangler.deploy.json

      - name: Deploy assets + Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: deploy --config ../wrangler.deploy.json
